<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecCoding Vertical Slice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Minimal runnable slice</p>
          <h1>SpecCoding 任务样例</h1>
          <p class="lead">一个从前端界面到后端 API、再到测试验证的最小纵切。</p>
        </div>
        <a class="secondary-link" href="/api/health">API health</a>
      </header>

      <section class="panel" aria-labelledby="create-title">
        <div class="panel-heading">
          <h2 id="create-title">创建任务</h2>
          <p>使用统一 UI 规范和 Hardness 检查前，先跑通这条完整链路。</p>
        </div>
        <form id="task-form" class="task-form">
          <label for="task-title">任务标题</label>
          <div class="task-form-row">
            <input id="task-title" name="title" maxlength="120" placeholder="例如：补充 L 级变更 design.md" required />
            <button type="submit">创建任务</button>
          </div>
          <p id="form-message" class="form-message" role="status"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="panel-heading">
          <h2 id="list-title">任务列表</h2>
          <p>点击任务即可切换完成状态。</p>
        </div>
        <div id="task-state" class="task-state">正在加载任务...</div>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
