schema: spec-driven

context: |
  本仓库使用轻量 Hardness 规范约束 AI 产出。
  每个变更默认遵守 spec/hardness.md。
  复杂度分为 S / M / L：小改动走轻流程，大变更先做架构讨论。
  可复制样例位于 examples/，归档前运行 validation/validate-hardness.cmd。

rules:
  design:
    - 对 M/L 级变更，必须说明复杂度等级、模块边界、关键取舍、失败处理与回滚路径。
    - S 级变更可以省略 design.md，但 tasks.md 仍必须包含 Hardness Check。
  tasks:
    - 必须包含 spec/hardness.md 中定义的 "## Hardness Check" 区块。
    - 必须选择复杂度等级 S / M / L。
    - 不要用大量 checklist 稀释重点，只保留边界、失败、验证、可观测性、回滚五类底线。
